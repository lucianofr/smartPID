<!doctype html>
<html lang="pt-BR" data-theme="optimizer">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart PID</title>
    <link rel="preload" href="/src/assets/fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/plex-mono-latin-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/plex-mono-latin-600.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/poppins-latin-700.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Pre-paint theme (§6.8): apply the persisted theme before first paint so a
      // returning Phosphor user never flashes Neon. Mirrors LEGACY_THEME_MAP in
      // src/theme/ThemeProvider.tsx — ThemeProvider.test.tsx enforces the sync,
      // including that this fallback equals DEFAULT_THEME.
      (function () {
        try {
          var stored = localStorage.getItem('spid.theme');
          var legacy = { 'dark-room': 'phosphor', 'md3-dark': 'recorder', 'md3-light': 'recorder', 'ocean': 'recorder' };
          var valid = ['optimizer', 'optimizer-dark', 'recorder', 'phosphor', 'isa101', 'neon'];
          var theme = valid.indexOf(stored) >= 0 ? stored : legacy[stored] || 'optimizer';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          /* no storage: keep the static neon default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
