[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smart-pid-core"
version = "0.1.0"
description = "Smart PID — Backend daemon (Core Engine)"
requires-python = ">=3.13"
dependencies = [
    "smart-pid-domain",
    "pyzmq>=26.0",
    "msgpack>=1.0",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.3",
    "structlog>=24.0",
    "numpy>=2.0",
    "scipy>=1.11",
    "asyncua>=1.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "mypy>=1.10",
    "ruff>=0.4",
    "coverage>=7.5",
    "httpx>=0.28",
]

ai = [
    "stable-baselines3[extra]>=2.3",
    "gymnasium>=0.29",
]

[project.scripts]
smart-pid-core = "smart_pid_core.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/smart_pid_core"]
