[project]
name = "smart-pid-workspace"
version = "0.1.0"
description = "Smart PID Edge Platform — Workspace Root"
requires-python = ">=3.13"

[tool.uv.workspace]
members = ["packages/*"]
exclude = ["packages/smart_pid_web"]

[tool.uv.sources]
smart-pid-domain = { workspace = true }
smart-pid-core = { workspace = true }
smart-pid-hmi = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["smart_pid_domain", "smart_pid_core", "smart_pid_hmi"]

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: marks tests requiring external services (OPC-UA servers, etc.)",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-qt>=4.4",
]
